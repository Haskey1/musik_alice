name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Rust и скрипты
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config shellcheck
      - name: Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: checks-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Версия релиза совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PYVERSION'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == "v" + version, "Release tag must match Cargo.toml"
          PYVERSION
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked
      - run: shellcheck install.sh scripts/*.sh packaging/*.sh packaging/S99musik-alice
      - run: python3 -m py_compile bin/musikalice

  arm:
    name: ARMv7 / glibc 2.23
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config curl bzip2 xz-utils qemu-user
      - name: Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target armv7-unknown-linux-gnueabihf
          rustup default "$channel"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/musik-alice
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/bootstrap-arm.sh') }}
      - run: scripts/bootstrap-arm.sh
      - run: scripts/build-arm.sh
      - run: scripts/smoke-arm.sh
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: musikalice-armv7-linux-gnueabihf
          path: |
            dist/musikalice-armv7-linux-gnueabihf.tar.gz
            dist/SHA256SUMS
            dist/install.sh
            dist/INSTALL_SHA256SUMS
          if-no-files-found: error

  release:
    name: Публикация релиза по тегу
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: musikalice-armv7-linux-gnueabihf
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
