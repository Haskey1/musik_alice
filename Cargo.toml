[package]
name = "musik-alice"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Клиент сервера musik для Яндекс Станций: музыка, голосовое управление через Алису и TUI в одном бинарнике"
repository = "https://github.com/Haskey1/musik_alice"
publish = false

[[bin]]
name = "musikalice"
path = "src/main.rs"

[features]
default = ["alsa-backend"]
# Вывод звука и громкость через ALSA. Без него собирается заглушка (для тестов и CI без libasound).
alsa-backend = ["dep:alsa"]

[dependencies]
alsa = { version = "0.10", optional = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "ogg", "vorbis", "wav", "pcm"] }

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0

[profile.dev]
debug = 0
